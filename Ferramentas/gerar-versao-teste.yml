# Gera a versão de teste do Arena de Cartas na nuvem do GitHub:
#   - Windows (.exe, em .zip)
#   - Android (.apk)
#   - iPhone (.ipa SEM assinatura — para instalar com Sideloadly/AltStore ou assinar depois)
#
# Como usar: aba "Actions" do repositório > "Gerar versão de teste" > "Run workflow".
# Os arquivos aparecem no fim da execução, em "Artifacts".
#
# Precisa de 3 segredos (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  = conteúdo do arquivo C:\ProgramData\Unity\Unity_lic.ulf
#   UNITY_EMAIL    = e-mail da conta Unity
#   UNITY_PASSWORD = senha da conta Unity
name: Gerar versão de teste

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  VERSAO: 1.1.${{ github.run_number }}

jobs:
  # ---------------------------------------------------------------- Unity: Windows, Android e projeto do Xcode
  unity:
    name: Unity (${{ matrix.alvo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alvo: [StandaloneWindows64, Android, iOS]
    steps:
      - name: Liberar espaço em disco (as imagens do Unity são grandes)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: ${{ matrix.alvo != 'Android' }}

      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache da pasta Library (acelera as próximas vezes)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.alvo }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.alvo }}-

      - name: Gerar com o Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.alvo }}
          buildName: ArenaDeCartas
          versioning: Custom
          version: ${{ env.VERSAO }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage

      - name: Compactar o jogo de Windows
        if: matrix.alvo == 'StandaloneWindows64'
        run: |
          cd build/StandaloneWindows64
          sudo rm -rf ArenaDeCartas_BurstDebugInformation_DoNotShip
          sudo zip -qr ../../ArenaDeCartas-Windows-${VERSAO}.zip .

      - name: Enviar Windows
        if: matrix.alvo == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDeCartas-Windows
          path: ArenaDeCartas-Windows-*.zip

      - name: Enviar Android
        if: matrix.alvo == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDeCartas-Android
          path: build/Android/*.apk

      - name: Enviar projeto do Xcode (vai para o Mac)
        if: matrix.alvo == 'iOS'
        uses: actions/upload-artifact@v4
        with:
          name: projeto-xcode
          path: build/iOS
          retention-days: 1

  # ---------------------------------------------------------------- Mac da nuvem: compila o Xcode e monta o .ipa
  ipa:
    name: iPhone (.ipa)
    runs-on: macos-latest
    needs: unity
    steps:
      - name: Baixar o projeto do Xcode
        uses: actions/download-artifact@v4
        with:
          name: projeto-xcode
          path: build/iOS

      - name: Compilar sem assinatura e montar o .ipa
        run: |
          set -e
          PROJ=$(find build/iOS -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -n 1)
          echo "Projeto: $PROJ"
          find build/iOS -type f -name "*.sh" -exec chmod +x {} \;
          find build/iOS -type f -iname "usymtool*" -exec chmod +x {} \;
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "ArenaDeCartas-iPhone-${VERSAO}.ipa" Payload
          ls -lh *.ipa

      - name: Enviar iPhone
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDeCartas-iPhone
          path: ArenaDeCartas-iPhone-*.ipa
